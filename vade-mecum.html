<title>Vade Mecum Aberto</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="vm-versao" content="dev">
<meta name="vm-modo" content="artifact">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400&display=swap">
<link rel="stylesheet" href="estilo.css?v=dev">

<header class="topo">
  <div class="topo__in">
    <button class="icone-btn topo__menu" id="bt-menu" aria-label="Abrir índice" aria-controls="lateral" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <button class="marca" id="bt-inicio" aria-label="Vade Mecum, início">
      <svg class="marca__icone" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="7" fill="#7b1e2b"/>
        <rect x="21" y="8" width="4" height="3" rx="1" fill="#1f6b45"/><rect x="21" y="12.5" width="4" height="3" rx="1" fill="#1d4f91"/>
        <rect x="21" y="17" width="4" height="3" rx="1" fill="#cf6a2a"/><rect x="21" y="21.5" width="4" height="3" rx="1" fill="#c49a12"/>
        <rect x="8" y="6" width="14.5" height="20" rx="1.5" fill="#faf7f2"/>
        <path d="M10.5 10h9.5M10.5 13h9.5M10.5 16h6M10.5 19h9.5M10.5 22h6" stroke="#c9beb4" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <span class="marca__nome">Vade Mecum</span>
    </button>
    <label class="busca">
      <svg class="busca__lupa" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
      <input id="busca" type="search" placeholder="Buscar ou ir direto: cc 1228" autocomplete="off" aria-label="Buscar nas leis">
      <kbd class="busca__atalho" aria-hidden="true">/</kbd>
    </label>
  </div>
</header>

<div class="casca">
  <nav class="lateral" id="lateral" aria-label="Índice das leis">
    <div id="indice"></div>
    <section class="prefs" aria-label="Preferências de leitura">
      <div class="prefs__linha">
        <span>Tamanho do texto</span>
        <div class="segmentado">
          <button id="bt-fmenos" aria-label="Diminuir o texto">A−</button>
          <button id="bt-fmais" aria-label="Aumentar o texto">A+</button>
        </div>
      </div>
      <div class="prefs__linha" id="linha-tema" hidden>
        <span>Tema</span>
        <div class="segmentado" id="tema">
          <button data-tema="" aria-pressed="true">Auto</button>
          <button data-tema="light" aria-pressed="false">Claro</button>
          <button data-tema="dark" aria-pressed="false">Escuro</button>
        </div>
      </div>
      <p class="status" id="status"></p>
    </section>
  </nav>
  <div class="veu" id="veu" hidden></div>
  <main class="principal" id="principal" tabindex="-1">
    <p class="carregando">Carregando…</p>
  </main>
</div>

<template id="tpl-ferramentas">
  <div class="ferramentas" id="ferramentas" role="group" aria-label="Grifar e anotar">
    <div class="ferramentas__linha">
      <span class="ferramentas__rotulo">Marca-texto</span>
      <div class="cores">
        <button class="cor cor--amarelo" data-cor="amarelo" aria-label="Amarelo"></button>
        <button class="cor cor--verde" data-cor="verde" aria-label="Verde"></button>
        <button class="cor cor--rosa" data-cor="rosa" aria-label="Rosa"></button>
        <button class="cor cor--azul" data-cor="azul" aria-label="Azul"></button>
        <button class="cor cor--nenhuma" data-cor="" aria-label="Sem cor">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <button class="btn btn--pequeno" data-acao="favorito" aria-pressed="false">★ Favorito</button>
      <button class="btn btn--pequeno" data-acao="copiar">Copiar texto</button>
      <button class="icone-btn ferramentas__fechar" data-acao="fechar" aria-label="Fechar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <textarea class="ferramentas__nota" placeholder="Sua anotação sobre este artigo. Salva sozinha." aria-label="Anotação"></textarea>
  </div>
</template>

<script src="app.js?v=dev"></script>
