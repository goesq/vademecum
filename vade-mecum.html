<title>Vade Mecum Aberto</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400&display=swap">
<style>
/* Layout: barra superior com busca; índice lateral com abas coloridas por código (como as abas de um vade mecum impresso); coluna de leitura estreita. */
:root {
  --bg: #f5f6f4;
  --surface: #ffffff;
  --ink: #1a1e23;
  --muted: #5b646d;
  --line: #dde1de;
  --accent: #7b1e2b;
  --accent-soft: #f4e7e8;
  --hl-amarelo: #fff0a3;
  --hl-verde: #d3f0c8;
  --hl-rosa: #fad2df;
  --hl-azul: #cfe3f9;
  --veu: rgba(20, 22, 25, .35);
  --serif: "Literata", "Iowan Old Style", Georgia, "Times New Roman", serif;
  --ui: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --fs-leitura: 17px;
  --topo: 58px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121416; --surface: #1a1d20; --ink: #e6e8e9; --muted: #9aa2aa; --line: #2c3135;
    --accent: #e48b98; --accent-soft: #3a2328;
    --hl-amarelo: #4f4512; --hl-verde: #21422a; --hl-rosa: #4f2437; --hl-azul: #1d3854;
    --veu: rgba(0, 0, 0, .55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121416; --surface: #1a1d20; --ink: #e6e8e9; --muted: #9aa2aa; --line: #2c3135;
  --accent: #e48b98; --accent-soft: #3a2328;
  --hl-amarelo: #4f4512; --hl-verde: #21422a; --hl-rosa: #4f2437; --hl-azul: #1d3854;
  --veu: rgba(0, 0, 0, .55);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--ui); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.pad { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* topo */
.topo { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.topo-in { display: flex; align-items: center; gap: 12px; height: var(--topo); max-width: 1280px; margin: 0 auto; }
.marca { display: flex; align-items: baseline; gap: 6px; background: none; border: 0; padding: 0; cursor: pointer; white-space: nowrap; }
.marca b { font: 700 20px/1 var(--serif); letter-spacing: -.01em; }
.marca span { font: 500 11px/1 var(--ui); letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
.menu { display: none; width: 38px; height: 38px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer; flex: none; }
.busca { flex: 1; min-width: 0; max-width: 520px; margin-left: auto; position: relative; }
.busca input { width: 100%; height: 38px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); font: 15px var(--ui); padding: 0 12px 0 34px; }
.busca svg { position: absolute; left: 11px; top: 11px; width: 16px; height: 16px; stroke: var(--muted); fill: none; stroke-width: 2; }
.fonte { display: flex; gap: 4px; flex: none; }
.fonte button { width: 34px; height: 34px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer; font-family: var(--serif); }

/* casca */
.casca { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 40px; max-width: 1280px; margin: 0 auto; }
.lateral { position: sticky; top: calc(var(--topo) + env(safe-area-inset-top, 0px)); height: calc(100vh - var(--topo) - env(safe-area-inset-top, 0px)); overflow-y: auto; padding-block: 18px 24px; display: flex; flex-direction: column; gap: 18px; }
.grupo h3 { font: 600 11px/1 var(--ui); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px 10px; }
.grupo ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; }
.item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: none; border: 0; border-radius: 6px; padding: 6px 8px 6px 0; cursor: pointer; }
.item:hover { background: var(--bg); }
.item[aria-current="true"] { background: var(--accent-soft); }
.aba { width: 6px; align-self: stretch; border-radius: 0 3px 3px 0; background: var(--cor, var(--muted)); flex: none; }
.item .sg { font-weight: 600; min-width: 4.2em; font-variant-numeric: tabular-nums; }
.item .nm { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.status { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: flex-start; margin: auto 0 0 10px; }
.status i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-top: 5px; flex: none; }
.status.conta i { background: #2f8f57; }
.veu { display: none; }

main { min-width: 0; padding-block: 28px 96px; }
.leitor { max-width: 46rem; }
.lombada { position: fixed; top: 0; right: 0; bottom: 0; width: 6px; background: var(--cor, transparent); z-index: 5; }

/* cabeçalho da lei */
.cab { border-top: 6px solid var(--cor); padding-top: 18px; margin-bottom: 18px; }
.cab .sg { font: 600 12px/1 var(--ui); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.cab h1 { font: 700 clamp(26px, 4vw, 36px)/1.15 var(--serif); margin: 8px 0 6px; text-wrap: balance; letter-spacing: -.01em; }
.cab .ementa { font: italic 16px/1.5 var(--serif); color: var(--muted); margin: 0 0 10px; }
.cab .meta { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 14px; }
.ctrl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 16px 0 6px; padding: 10px 0; border-block: 1px solid var(--line); position: sticky; top: calc(var(--topo) + env(safe-area-inset-top, 0px)); background: var(--bg); z-index: 6; }
.ir { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); overflow: hidden; }
.ir label { padding: 0 4px 0 10px; color: var(--muted); font-size: 14px; }
.ir input { width: 6.5em; border: 0; background: none; height: 34px; font: 15px var(--ui); color: var(--ink); padding: 0 6px; }
.ir button { border: 0; border-left: 1px solid var(--line); background: var(--bg); height: 34px; padding: 0 12px; cursor: pointer; font-weight: 500; }
.chk { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); cursor: pointer; }
.btn { height: 34px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer; font-size: 14px; white-space: nowrap; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.aviso-ir { font-size: 13px; color: var(--accent); }
.dica { font-size: 13px; color: var(--muted); margin: 8px 0 18px; }

.sumario { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 10px 14px; margin: 10px 0 20px; max-height: 60vh; overflow: auto; }
.sumario a { display: block; text-decoration: none; color: var(--ink); font-size: 14px; padding: 3px 0; }
.sumario a:hover { color: var(--accent); }
.sumario .s2 { padding-left: 14px; } .sumario .s3 { padding-left: 28px; color: var(--muted); } .sumario .s4, .sumario .s5, .sumario .s6 { padding-left: 42px; color: var(--muted); font-size: 13px; }

/* texto legal */
.texto { font: var(--fs-leitura)/1.62 var(--serif); }
.texto .tit { font-family: var(--ui); text-align: center; text-wrap: balance; margin: 2.2em 0 1em; scroll-margin-top: calc(var(--topo) + 70px + env(safe-area-inset-top, 0px)); }
.texto .tit.l1, .texto .tit.l2 { font-size: .9em; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.texto .tit.l3 { font-size: .86em; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; }
.texto .tit.l4, .texto .tit.l5, .texto .tit.l6 { font-size: .86em; font-weight: 500; color: var(--muted); }
.texto .solto { color: var(--muted); font-size: .92em; }
.texto .rubrica { margin: 1.1em 0 .2em; font-size: .95em; }
.art { padding: 6px 10px; margin: 0 -10px 4px; border-radius: 6px; scroll-margin-top: calc(var(--topo) + 70px + env(safe-area-inset-top, 0px)); }
.art p { margin: 0 0 .4em; }
.art .inc { padding-left: 1.4em; }
.art .ali { padding-left: 2.8em; }
.art .item-n { padding-left: 4.2em; }
.art .par { padding-left: .7em; }
.artn { font: 600 .9em var(--ui); color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; border-bottom: 1px dashed var(--accent); }
.artn .estrela { display: none; }
.fav .artn .estrela { display: inline; margin-right: 3px; }
.g-amarelo { background: var(--hl-amarelo); } .g-verde { background: var(--hl-verde); } .g-rosa { background: var(--hl-rosa); } .g-azul { background: var(--hl-azul); }
.nota { font-family: var(--ui); font-size: .76em; color: var(--muted); }
.sem-notas .nota:not(.rev), .sem-notas .rev .longo { display: none; }
.anot { font: .84em/1.5 var(--ui); background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--accent); padding: 6px 10px; border-radius: 0 6px 6px 0; margin: 4px 0 4px; white-space: pre-wrap; overflow-wrap: anywhere; }
.flash { animation: flash 1.4s ease-out; }
@keyframes flash { from { box-shadow: 0 0 0 3px var(--accent); } to { box-shadow: 0 0 0 3px transparent; } }
@media (prefers-reduced-motion: reduce) { .flash { animation: none; outline: 2px solid var(--accent); } }

/* ferramentas do artigo */
.ferr { font-family: var(--ui); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin: 0 0 12px; display: grid; gap: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.08); }
.ferr-linha { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.ferr-rot { font-size: 12px; color: var(--muted); margin-right: 2px; }
.cor { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); cursor: pointer; }
.cor[aria-pressed="true"] { border-color: var(--ink); }
.c-amarelo { background: var(--hl-amarelo); } .c-verde { background: var(--hl-verde); } .c-rosa { background: var(--hl-rosa); } .c-azul { background: var(--hl-azul); }
.c-nenhuma { background: var(--surface); color: var(--muted); font-size: 13px; }
.sep { width: 1px; height: 24px; background: var(--line); margin: 0 4px; }
.fechar { margin-left: auto; }
.ferr textarea { width: 100%; min-height: 64px; resize: vertical; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--ui); padding: 8px 10px; }

/* início */
.ola h1 { font: 700 clamp(28px, 5vw, 42px)/1.1 var(--serif); margin: 0 0 10px; letter-spacing: -.015em; text-wrap: balance; }
.ola p { color: var(--muted); max-width: 38rem; margin: 0 0 6px; }
.continuar { display: inline-flex; gap: 8px; align-items: center; margin-top: 14px; }
.sec-tit { font: 600 12px/1 var(--ui); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 34px 0 12px; }
.grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.cartao { display: grid; grid-template-columns: 6px minmax(0, 1fr); gap: 12px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px 12px 0; cursor: pointer; overflow: hidden; }
.cartao:hover { border-color: var(--cor, var(--accent)); }
.cartao .aba { border-radius: 0 3px 3px 0; }
.cartao b { display: block; font: 600 17px/1.2 var(--serif); }
.cartao span { display: block; font-size: 13px; color: var(--muted); margin-top: 3px; }
.rodape { margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); max-width: 46rem; }
.rodape p { margin: 0 0 6px; }

/* súmulas, grifos, busca */
.abas-sum { display: flex; flex-wrap: wrap; gap: 6px; }
.filtro { height: 34px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); padding: 0 10px; font: 14px var(--ui); min-width: 0; flex: 1 1 180px; max-width: 280px; }
.sum .assunto { display: block; font: 500 12px var(--ui); color: var(--muted); margin-bottom: 2px; }
.cancelada { opacity: .6; }
.cancelada .tag { font: 600 11px var(--ui); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-left: 6px; }
.lei-chip { display: inline-flex; align-items: center; gap: 6px; font: 600 12px/1 var(--ui); padding: 4px 8px 4px 6px; border-radius: 4px; background: var(--bg); border: 1px solid var(--line); }
.lei-chip::before { content: ""; width: 4px; height: 12px; border-radius: 2px; background: var(--cor); }
.res { display: block; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin-bottom: 8px; cursor: pointer; }
.res:hover { border-color: var(--accent); }
.res .topo-res { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; font: 600 14px var(--ui); }
.res .trecho { font: 15px/1.55 var(--serif); }
mark { background: var(--hl-amarelo); color: inherit; border-radius: 2px; padding: 0 1px; }
.salto { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 16px; }
.salto button { border: 1px solid var(--accent); color: var(--accent); background: var(--accent-soft); border-radius: 8px; padding: 8px 12px; cursor: pointer; font-weight: 600; }
.filtros { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 16px; }
.filtros button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 10px; font-size: 13px; cursor: pointer; }
.filtros button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.vazio { border: 1px dashed var(--line); border-radius: 10px; padding: 22px; color: var(--muted); max-width: 40rem; }
.vazio b { color: var(--ink); }
.grifo-cab { display: flex; align-items: center; gap: 10px; margin: 26px 0 8px; }
.carregando { color: var(--muted); padding: 20px 0; }

@media (max-width: 860px) {
  .menu { display: inline-grid; place-items: center; }
  .casca { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .lateral { position: fixed; top: 0; left: 0; bottom: 0; height: auto; width: min(300px, 86vw); z-index: 40; background: var(--surface); border-right: 1px solid var(--line); transform: translateX(-102%); transition: transform .2s ease; padding: calc(env(safe-area-inset-top, 0px) + 16px) 12px calc(env(safe-area-inset-bottom, 0px) + 16px) max(12px, env(safe-area-inset-left, 0px)); }
  .gaveta .lateral { transform: none; }
  .gaveta .veu { display: block; position: fixed; inset: 0; background: var(--veu); z-index: 35; }
  .lombada { display: none; }
  .marca span { display: none; }
  .fonte { display: none; }
  main { padding-top: 18px; }
  .ctrl { gap: 6px; }
  .art, .texto .tit { scroll-margin-top: calc(var(--topo) + 112px + env(safe-area-inset-top, 0px)); }
}
@media (prefers-reduced-motion: reduce) { .lateral { transition: none; } }
</style>

<header class="topo">
  <div class="topo-in pad">
    <button class="menu" id="menu" aria-label="Abrir índice"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <button class="marca" id="inicio" aria-label="Início"><b>Vade Mecum</b><span>aberto</span></button>
    <div class="busca">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="busca" type="search" placeholder="Buscar… ou “cc 1228”, “sv 11”" autocomplete="off" aria-label="Buscar">
    </div>
    <div class="fonte" aria-label="Tamanho do texto">
      <button id="fmenos" aria-label="Diminuir texto" style="font-size:13px">A</button>
      <button id="fmais" aria-label="Aumentar texto" style="font-size:18px">A</button>
    </div>
  </div>
</header>

<div class="casca pad">
  <aside class="lateral" id="lateral" aria-label="Índice"></aside>
  <div class="veu" id="veu"></div>
  <main id="principal"><div class="carregando">Carregando…</div></main>
</div>
<div class="lombada" id="lombada"></div>

<template id="tpl-ferr">
  <div class="ferr" id="ferr">
    <div class="ferr-linha">
      <span class="ferr-rot">Marca-texto</span>
      <button class="cor c-amarelo" data-cor="amarelo" aria-label="Amarelo"></button>
      <button class="cor c-verde" data-cor="verde" aria-label="Verde"></button>
      <button class="cor c-rosa" data-cor="rosa" aria-label="Rosa"></button>
      <button class="cor c-azul" data-cor="azul" aria-label="Azul"></button>
      <button class="cor c-nenhuma" data-cor="" aria-label="Sem cor">✕</button>
      <span class="sep"></span>
      <button class="btn" id="ferr-fav" aria-pressed="false">★ Favorito</button>
      <button class="btn" id="ferr-copiar">Copiar texto</button>
      <button class="btn fechar" id="ferr-fechar">Fechar</button>
    </div>
    <textarea id="ferr-nota" placeholder="Sua anotação sobre este artigo (salva sozinha)…" aria-label="Anotação"></textarea>
  </div>
</template>

<script>
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const principal = $("#principal");
const st = {
  indice: [], leis: {}, sumulas: null, marcas: {},
  vista: null, notas: true, ultimaVista: null,
  sumTrib: "SV", sumCanc: false, sumFiltro: "", buscaFiltro: null,
};
const GRUPOS = ["Constituição", "Códigos", "Estatutos e leis"];
const NOME_TRIB = { SV: "Súmula Vinculante", STF: "Súmula do STF", STJ: "Súmula do STJ" };
const SUMULAS_COR = "#4b5563";
const VERSAO = "20261021c"; // muda a cada nova geração dos dados, para o navegador não usar cópia antiga
const SITE = false; // build.py troca para true na versão site (instalável, offline, backup em arquivo)

function ler(k, padrao) { try { const v = localStorage.getItem(k); return v == null ? padrao : JSON.parse(v); } catch { return padrao; } }
function gravar(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
// remove acentos sem mudar o comprimento, para casar posições
function norm(s) { let o = ""; for (const c of s.toLowerCase()) o += c.normalize("NFD")[0]; return o; }
function plano(s) { return s.replace(/\[([^\]]+)\]\([^)]+\)/g, "$1").replace(/\*+/g, "").replace(/\s+/g, " ").trim(); }
function lei(id) { return st.indice.find(l => l.id === id); }

/* ---------- formatação do texto legal ---------- */
function fmt(s) {
  let h = esc(s);
  h = h.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  h = h.replace(/\*\((.+?)\)\*/g, (_, t) => {
    const r = t.match(/^((?:Revogad|Vetad)[oa]s?)(.*)$/s);
    return r ? `<span class="nota rev">(${r[1]}<span class="longo">${r[2]}</span>)</span>` : `<span class="nota">(${t})</span>`;
  });
  h = h.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
  h = h.replace(/(^|[^*\w])\*([^*\s][^*]*?)\*/g, "$1<i>$2</i>");
  return h;
}
function classe(p) {
  if (/^\*\*(§|Parágrafo)/.test(p)) return "par";
  if (/^[IVXLCDM]+\s*[-–—]/.test(p)) return "inc";
  if (/^[a-z]\)/.test(p)) return "ali";
  if (/^\d+\.\s/.test(p)) return "item-n";
  return "";
}
function rotuloArt(n) {
  const base = parseInt(n.replace(/\./g, ""), 10);
  return "Art. " + n + (/^\d+$/.test(n.replace(/\./g, "")) && base < 10 ? "º" : ".");
}
function htmlArt(leiId, n, mk) {
  const cls = ["art"];
  if (mk?.c) cls.push("g-" + mk.c);
  if (mk?.f) cls.push("fav");
  const corpo = n.p.map((p, j) => {
    if (j === 0) {
      const resto = p.replace(/^\*\*"?Art\.?[^*]*\*\*\s*\.?\s*/, "");
      return `<p><button class="artn"><span class="estrela">★</span>${esc(rotuloArt(n.n))}</button> ${fmt(resto)}</p>`;
    }
    return `<p class="${classe(p)}">${fmt(p)}</p>`;
  }).join("");
  return `<article class="${cls.join(" ")}" id="a-${leiId}-${n.id}" data-lei="${leiId}" data-id="${n.id}">${corpo}${mk?.nota ? `<div class="anot">${esc(mk.nota)}</div>` : ""}</article>`;
}
function htmlSumula(s, mk) {

/* ---------- grifos: conta (db) com reserva no navegador ---------- */
const arm = { modo: "local", db: null, uid: null, voando: {}, pendente: {}, timers: {} };
function salvarMarcas(leiId) {
  if (arm.modo === "local") { gravar("vm-marcas", st.marcas); return; }
  clearTimeout(arm.timers[leiId]);
  arm.timers[leiId] = setTimeout(() => { delete arm.timers[leiId]; escrever(leiId); }, 700);
}
async function escrever(leiId, tentativa = 0) {
  if (arm.modo !== "conta") return;
  if (arm.voando[leiId]) { arm.pendente[leiId] = true; return; }
  arm.voando[leiId] = true;
  try {
    await arm.db.collection("data/users/" + arm.uid).doc(leiId).set({ arts: st.marcas[leiId] || {} });
  } catch (e) {
    if (e?.code === "unavailable" && tentativa === 0) {
      arm.voando[leiId] = false;
      setTimeout(() => escrever(leiId, 1), 800 + Math.random() * 1200);
      return;
    }
    paraLocal();
  }
  arm.voando[leiId] = false;
  if (arm.pendente[leiId]) { arm.pendente[leiId] = false; escrever(leiId); }
}
function paraLocal() {
  if (arm.modo === "local") return;
  arm.modo = "local";
  gravar("vm-marcas", st.marcas);
  mostrarStatus();
}
async function conectarConta() {
  if (!window.claude?.use) return;
  try {
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    const uid = await user?.id();
    if (!db || !uid) return;
    arm.db = db; arm.uid = uid; arm.modo = "conta";
    let primeiro = true;
    db.collection("data/users/" + uid).onSnapshot(snap => {
      const novo = {};
      snap.docs.forEach(d => { const a = d.data()?.arts; if (a) novo[d.id] = JSON.parse(JSON.stringify(a)); });
      const sujos = [];
      if (primeiro) {
        primeiro = false;
        // grifos feitos antes neste navegador sobem para a conta
        const loc = ler("vm-marcas", {});
        for (const [l, arts] of Object.entries(loc)) for (const [a, m] of Object.entries(arts)) {
          novo[l] ||= {};
          if (!novo[l][a] || (novo[l][a].t || 0) < (m.t || 0)) { novo[l][a] = m; if (!sujos.includes(l)) sujos.push(l); }
        }
        try { localStorage.removeItem("vm-marcas"); } catch {}
      }
      // não atropela edições ainda não gravadas
      for (const l of Object.keys(st.marcas)) if (arm.timers[l] || arm.voando[l]) novo[l] = st.marcas[l];
      st.marcas = novo;
      sujos.forEach(l => escrever(l));
      aplicarMarcas();
      mostrarStatus();
    }, () => paraLocal());
    mostrarStatus();
  } catch { /* fica no modo local */ }
}
function marca(leiId, id) { return st.marcas[leiId]?.[id]; }
function mudarMarca(leiId, id, patch) {
  const doc = (st.marcas[leiId] ||= {});
  const m = { ...(doc[id] || {}), ...patch, t: Date.now() };
  if (!m.c) delete m.c;
  if (!m.f) delete m.f;
  if (!m.nota) delete m.nota;
  if (!m.c && !m.f && !m.nota) delete doc[id]; else doc[id] = m;
  if (!Object.keys(doc).length) st.marcas[leiId] = {};
  atualizarArt(leiId, id);
  salvarMarcas(leiId);
}
function atualizarArt(leiId, id) {
  const el = document.getElementById(`a-${leiId}-${id}`);
  if (!el) return;
  const m = marca(leiId, id);
  el.classList.remove("g-amarelo", "g-verde", "g-rosa", "g-azul", "fav");
  if (m?.c) el.classList.add("g-" + m.c);
  if (m?.f) el.classList.add("fav");
  let an = el.querySelector(".anot");
  if (m?.nota) {
    if (!an) { an = document.createElement("div"); an.className = "anot"; el.appendChild(an); }
    an.textContent = m.nota;
  } else if (an) an.remove();
}
function aplicarMarcas() {
  $$("article.art").forEach(el => atualizarArt(el.dataset.lei, el.dataset.id));
  if (ferr.alvo) sincronizarFerr();
}
function mostrarStatus() {
  const el = $("#status");
  if (!el) return;
  el.className = "status" + (arm.modo === "conta" ? " conta" : "");
  el.innerHTML = arm.modo === "conta"
    ? "<i></i><span>Grifos e anotações salvos na sua conta, em qualquer aparelho.</span>"
    : `<i></i><span>Grifos e anotações salvos neste ${SITE ? "aparelho" : "navegador"}.${st.offline ? " Funciona sem internet." : ""}</span>`;
}

/* ---------- ferramentas do artigo ---------- */
const ferr = { el: null, alvo: null, t: null };
function abrirFerr(art) {
  if (!ferr.el) {
    ferr.el = $("#tpl-ferr").content.firstElementChild.cloneNode(true);
    ferr.el.addEventListener("click", e => {
      const b = e.target.closest("button");
      if (!b || !ferr.alvo) return;
      const { lei: l, id } = ferr.alvo;
      if (b.dataset.cor !== undefined) mudarMarca(l, id, { c: b.dataset.cor });
      else if (b.id === "ferr-fav") mudarMarca(l, id, { f: !marca(l, id)?.f });
      else if (b.id === "ferr-copiar") copiar(b);
      else if (b.id === "ferr-fechar") fecharFerr();
      sincronizarFerr();
    });
    ferr.el.querySelector("textarea").addEventListener("input", e => {
      clearTimeout(ferr.t);
      const { lei: l, id } = ferr.alvo, v = e.target.value;
      ferr.t = setTimeout(() => mudarMarca(l, id, { nota: v.trim() ? v : "" }), 500);
    });
  }
  if (ferr.alvo && ferr.alvo.el === art) { fecharFerr(); return; }
  fecharFerr();
  ferr.alvo = { lei: art.dataset.lei, id: art.dataset.id, el: art };
  art.after(ferr.el);
  sincronizarFerr();
}
function sincronizarFerr() {
  const { lei: l, id } = ferr.alvo, m = marca(l, id) || {};
  $$(".cor", ferr.el).forEach(b => b.setAttribute("aria-pressed", String((m.c || "") === b.dataset.cor && (!!m.c || b.dataset.cor === ""))));
  $("#ferr-fav", ferr.el).setAttribute("aria-pressed", String(!!m.f));
  const ta = $("textarea", ferr.el);
  if (document.activeElement !== ta) ta.value = m.nota || "";
}
function fecharFerr() {
  if (!ferr.alvo) return;
  const ta = $("textarea", ferr.el);
  if (ferr.t) { clearTimeout(ferr.t); ferr.t = null; mudarMarca(ferr.alvo.lei, ferr.alvo.id, { nota: ta.value.trim() ? ta.value : "" }); }
  ferr.el.remove();
  ferr.alvo = null;
}
async function copiar(botao) {
  const { lei: l, el } = ferr.alvo;
  const c = el.cloneNode(true);
  c.querySelectorAll(".anot, .estrela, .tag").forEach(x => x.remove());
  const ref = l === "sumulas" ? "" : ` (${lei(l).sigla})`;
  const txt = [...c.querySelectorAll("p")].map(p => p.textContent.trim()).join("\n") + ref;
  try { await navigator.clipboard.writeText(txt); botao.textContent = "Copiado"; }
  catch {
    const r = document.createRange(); r.selectNodeContents(el);
    const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    botao.textContent = "Texto selecionado";
  }
  setTimeout(() => { botao.textContent = "Copiar texto"; }, 1600);
}

function exportarGrifos() {
  const blob = new Blob([JSON.stringify({ app: "vade-mecum-aberto", formato: 1, exportado: new Date().toISOString(), marcas: st.marcas }, null, 1)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `vade-mecum-grifos-${new Date().toLocaleDateString("sv")}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
async function importarGrifos(arquivo, aviso) {
  let novo;
  try { novo = JSON.parse(await arquivo.text()); } catch { novo = null; }
  if (!novo || novo.app !== "vade-mecum-aberto" || typeof novo.marcas !== "object") { aviso.textContent = "Esse arquivo não é um backup do Vade Mecum."; return; }
  let n = 0;
  for (const [l, arts] of Object.entries(novo.marcas)) {
    if (l !== "sumulas" && !lei(l)) continue;
    st.marcas[l] ||= {};
    for (const [id, m] of Object.entries(arts || {})) {
      if (!m || typeof m !== "object") continue;
      const atual = st.marcas[l][id];
      if (!atual || (atual.t || 0) < (m.t || 0)) {
        st.marcas[l][id] = { ...(["amarelo", "verde", "rosa", "azul"].includes(m.c) ? { c: m.c } : {}), ...(m.f ? { f: true } : {}), ...(typeof m.nota === "string" && m.nota ? { nota: m.nota } : {}), t: +m.t || Date.now() };
        n++;
      }
    }
    salvarMarcas(l);
  }
  await vistaGrifos();
  const a = $("#aviso-backup");
  if (a) a.textContent = n ? `${n} ${n === 1 ? "item importado" : "itens importados"}.` : "Nada novo nesse backup.";
}
function htmlBackup() {

  return `<div class="ctrl" style="position:static">
    <button class="btn" id="bt-exportar">Exportar backup</button>
    <label class="btn" style="display:inline-flex;align-items:center">Importar backup<input type="file" id="in-importar" accept="application/json,.json" hidden></label>
    <span class="aviso-ir" id="aviso-backup" role="status"></span>
    <span class="dica" style="margin:0;flex-basis:100%">Seus grifos ficam só neste aparelho. Exporte de vez em quando, e importe o arquivo para levar tudo para outro celular ou computador.</span>
  </div>`;
}
function ligarBackup() {
  if (!SITE) return;
  $("#bt-exportar")?.addEventListener("click", exportarGrifos);
  $("#in-importar")?.addEventListener("change", e => { const f = e.target.files[0]; if (f) importarGrifos(f, $("#aviso-backup")); e.target.value = ""; });
}

function acharArt(id, q) {
  let s = q.trim().toLowerCase().replace(/^art(igo)?\.?\s*/, "").replace(/[º°ª]/g, "");
  let pre = "";
  if (/^adct/.test(s)) { pre = "adct-"; s = s.replace(/^adct\.?\s*(art\.?\s*)?/, ""); }
  const m = s.match(/^(\d[\d.]*)\s*-?\s*([a-z]{0,2})$/);
  if (!m) return null;
  const cand = pre + m[1].replace(/\./g, "") + (m[2] ? "-" + m[2].toUpperCase() : "");
  const L = st.leis[id];
  return L && L.nos.some(n => n.t === "a" && n.id === cand) ? cand : null;
}
function lembrar(id, art) {
  const n = art && st.leis[id]?.nos.find(x => x.id === art);
  gravar("vm-ultimo", { lei: id, art, rot: n ? n.n : null });
}

  principal.innerHTML = `<div class="leitor" style="--cor:${SUMULAS_COR}">
    <header class="cab"><div class="sg">Jurisprudência</div><h1>Súmulas</h1>
      <div class="meta"><span>Vinculantes: Banco Nacional de Precedentes (CNJ)</span><span>STF e STJ: cadernos oficiais dos tribunais</span></div></header>
    <div class="ctrl">
      <div class="abas-sum">${["SV", "STF", "STJ"].map(t => `<button class="btn" data-trib="${t}" aria-pressed="${st.sumTrib === t}">${t === "SV" ? "Vinculantes" : t}</button>`).join("")}</div>
      <input class="filtro" id="sum-filtro" type="search" placeholder="Filtrar por número ou palavra" value="${esc(st.sumFiltro)}" aria-label="Filtrar súmulas">
      <label class="chk"><input type="checkbox" id="sum-canc" ${st.sumCanc ? "checked" : ""}> Canceladas</label>
    </div>
    <p class="dica">Toque no número da súmula para grifar, favoritar ou anotar.</p>
    <div class="texto" id="lista-sum"></div></div>`;
  $$("[data-trib]").forEach(b => b.addEventListener("click", () => { st.sumTrib = b.dataset.trib; $$("[data-trib]").forEach(x => x.setAttribute("aria-pressed", String(x === b))); listarSumulas(); }));
  $("#sum-filtro").addEventListener("input", e => { st.sumFiltro = e.target.value; listarSumulas(); });
  $("#sum-canc").addEventListener("change", e => { st.sumCanc = e.target.checked; listarSumulas(); });
  listarSumulas();
  if (alvo) rolarPara(document.getElementById("a-sumulas-" + alvo)); else scrollTo(0, 0);
}
function listarSumulas() {
  fecharFerr();
  const f = norm(st.sumFiltro.trim());
  const num = /^\d+$/.test(f) ? +f : null;
  const m = st.marcas.sumulas || {};
  const lista = st.sumulas.filter(s => s.tr === st.sumTrib && (st.sumCanc || !s.cancelada)
    && (!f || (num !== null ? s.n === num : norm(s.x + " " + s.assunto).includes(f))));
  $("#lista-sum").innerHTML = lista.length ? lista.map(s => htmlSumula(s, m[s.tr + "-" + s.n])).join("")
    : `<div class="vazio">Nenhuma súmula ${NOME_TRIB[st.sumTrib].replace("Súmula ", "")} com “${esc(st.sumFiltro)}”.</div>`;
}

async function vistaGrifos() {
  marcarAtual("grifos");
  st.vista = { tipo: "grifos" };
  const leis = Object.keys(st.marcas).filter(l => Object.keys(st.marcas[l]).length);
  if (!leis.length) {
    principal.innerHTML = `<div class="leitor"><header class="cab" style="--cor:var(--accent)"><div class="sg">Seu estudo</div><h1>Meus grifos</h1></header>
      <div class="vazio"><b>Nada marcado ainda.</b><br>Abra uma lei, toque no “Art.” de um artigo e escolha uma cor, marque como favorito ou escreva uma anotação. Tudo aparece aqui, separado por lei.</div>${htmlBackup()}</div>`;
    ligarBackup();
    return;
  }
  principal.innerHTML = `<div class="carregando">Juntando seus grifos…</div>`;
  await Promise.all(leis.map(l => l === "sumulas" ? carregarSumulas() : carregarLei(l)));
  if (st.vista?.tipo !== "grifos") return;
  const ordem = [...st.indice.map(l => l.id), "sumulas"].filter(l => leis.includes(l));
  const total = ordem.reduce((a, l) => a + Object.keys(st.marcas[l]).length, 0);
  principal.innerHTML = `<div class="leitor"><header class="cab" style="--cor:var(--accent)"><div class="sg">Seu estudo</div><h1>Meus grifos</h1>
    <div class="meta"><span>${total} ${total === 1 ? "item marcado" : "itens marcados"}</span></div></header>
    ${htmlBackup()}
    <div class="ctrl"><label class="chk"><input type="checkbox" id="g-fav"> Só favoritos</label><label class="chk"><input type="checkbox" id="g-nota"> Só com anotação</label></div>
    <div class="texto ${st.notas ? "" : "sem-notas"}" id="lista-grifos"></div></div>`;
  ligarBackup();
  const desenhar = () => {
    fecharFerr();
    const soFav = $("#g-fav").checked, soNota = $("#g-nota").checked;
    $("#lista-grifos").innerHTML = ordem.map(l => {
      const m = st.marcas[l] || {};
      const ok = id => m[id] && (!soFav || m[id].f) && (!soNota || m[id].nota);
      let itens;
      if (l === "sumulas") itens = st.sumulas.filter(s => ok(s.tr + "-" + s.n)).map(s => htmlSumula(s, m[s.tr + "-" + s.n]));
      else itens = st.leis[l].nos.filter(n => n.t === "a" && ok(n.id)).map(n => htmlArt(l, n, m[n.id]));
      if (!itens.length) return "";
      const L = lei(l);
      return `<div class="grifo-cab"><span class="lei-chip" style="--cor:${L ? L.cor : SUMULAS_COR}">${esc(L ? L.sigla : "Súmulas")}</span><button class="btn" data-ir="${l}">Abrir ${esc(L ? L.sigla : "súmulas")}</button></div>${itens.join("")}`;
    }).join("") || `<div class="vazio">Nenhum item com esse filtro.</div>`;
  };
  $("#g-fav").addEventListener("change", desenhar);
  $("#g-nota").addEventListener("change", desenhar);
  desenhar();
  scrollTo(0, 0);
}

/* ---------- busca ---------- */
const idx = {};
function indexar(id) {
  if (idx[id]) return idx[id];
  if (id === "sumulas") return (idx[id] = st.sumulas.map(s => ({ id: s.tr + "-" + s.n, rot: s.tr === "SV" ? "Súmula Vinculante " + s.n : `Súmula ${s.n} do ${s.tr}`, txt: s.x, n: norm(s.x), canc: s.cancelada })));
  return (idx[id] = st.leis[id].nos.filter(n => n.t === "a").map(n => { const t = plano(n.p.join(" ")); return { id: n.id, rot: rotuloArt(n.n), txt: t, n: norm(t) }; }));
}
const ALIAS = { cf: "cf", crfb: "cf", cc: "cc", cpc: "cpc", cp: "cp", cpp: "cpp", clt: "clt", cdc: "cdc", ctn: "ctn", eca: "eca", lindb: "lindb", oab: "oab", eoab: "oab", jec: "jec", lep: "lep", drogas: "drogas", lmp: "lmp", hediondos: "hed", lia: "lia", lpa: "lpa", lms: "ms", ms: "ms" };
function saltos(q) {
  const s = norm(q.trim()).replace(/[º°ª,]/g, " ").replace(/\s+/g, " ").trim();
  const out = [];
  let m = s.match(/^(?:art(?:igo)?\.?\s*)?(\d[\d.]*(?:\s*-\s*[a-z]{1,2})?)\s+(?:do\s+|da\s+)?([a-z]+)$/) || s.match(/^([a-z]+)\s+(?:art(?:igo)?\.?\s*)?(adct\s*\d[\d.]*|\d[\d.]*(?:\s*-\s*[a-z]{1,2})?)$/);
  if (m) {
    const [sig, art] = /^\d/.test(m[1]) ? [m[2], m[1]] : [m[1], m[2]];
    const id = ALIAS[sig];
    if (id) out.push({ lei: id, art, rot: `${lei(id).sigla}, art. ${art.replace(/\s/g, "")}` });
  }
  m = s.match(/^(?:sumula\s+)?(sv|vinculante)\s*(\d+)$/) || s.match(/^sumula\s+vinculante\s+(\d+)$/);
  if (m) { const n = m[2] || m[1]; out.push({ sum: "SV-" + n, rot: "Súmula Vinculante " + n }); }
  m = s.match(/^(?:sumula\s+)?(\d+)\s+(?:do\s+)?(stf|stj)$/) || s.match(/^(?:sumula\s+)?(stf|stj)\s+(\d+)$/);
  if (m) { const [n, t] = /^\d/.test(m[1]) ? [m[1], m[2]] : [m[2], m[1]]; out.push({ sum: t.toUpperCase() + "-" + n, rot: `Súmula ${n} do ${t.toUpperCase()}` }); }
  return out;
}
let buscaSeq = 0;
async function buscar(q) {
  const seq = ++buscaSeq;
  if (!q.trim()) { if (st.ultimaVista) { const v = st.ultimaVista; st.ultimaVista = null; st.vista = null; ir(v.id || v.tipo); } return; }
  if (st.vista?.tipo !== "busca") st.ultimaVista = st.vista;
  st.vista = { tipo: "busca" };
  marcarAtual("busca");
  fecharFerr();
  const sal = saltos(q);
  const salHtml = sal.length ? `<div class="salto">${sal.map(s => `<button data-salto='${esc(JSON.stringify(s))}'>Ir para ${esc(s.rot)} →</button>`).join("")}</div>` : "";
  const frase = q.trim().match(/^"(.+)"$/);
  const termos = frase ? [norm(frase[1])] : norm(q).split(/\s+/).filter(t => t.length > 1);
  if (!termos.length || (termos.join("").length < 3 && !frase)) { principal.innerHTML = `<div class="leitor">${salHtml}<p class="dica">Digite pelo menos 3 letras.</p></div>`; return; }
  const faltam = st.indice.filter(l => !st.leis[l.id]);
  if (faltam.length || !st.sumulas) {
    principal.innerHTML = `<div class="leitor">${salHtml}<div class="carregando">Carregando as leis para buscar (só na primeira vez)…</div></div>`;
    await Promise.all([...faltam.map(l => carregarLei(l.id).catch(() => null)), carregarSumulas()]);
    if (seq !== buscaSeq) return;
  }
  const res = [];
  const contagem = {};
  for (const id of [...st.indice.map(l => l.id), "sumulas"]) {
    if (id !== "sumulas" && !st.leis[id]) continue;
    for (const a of indexar(id)) {
      if (termos.every(t => a.n.includes(t))) {
        contagem[id] = (contagem[id] || 0) + 1;
        if (!st.buscaFiltro || st.buscaFiltro === id) res.push({ lei: id, a });
      }
    }
  }
  const total = Object.values(contagem).reduce((a, b) => a + b, 0);
  // quem tem as palavras juntas, na ordem digitada, vem primeiro
  const junto = termos.join(" ");
  if (termos.length > 1) res.sort((x, y) => y.a.n.includes(junto) - x.a.n.includes(junto));
  const mostra = res.slice(0, 200);
  const chip = id => { const L = lei(id); return `<span class="lei-chip" style="--cor:${L ? L.cor : SUMULAS_COR}">${esc(L ? L.sigla : "Súmula")}</span>`; };
  principal.innerHTML = `<div class="leitor">${salHtml}
    <div class="sg" style="font-size:14px;color:var(--muted)">${total.toLocaleString("pt-BR")} ${total === 1 ? "resultado" : "resultados"} para “${esc(q.trim())}”${res.length > 200 ? " · mostrando os 200 primeiros" : ""}</div>
    ${Object.keys(contagem).length > 1 ? `<div class="filtros"><button data-filtro="" aria-pressed="${!st.buscaFiltro}">Todas</button>${Object.entries(contagem).map(([id, n]) => `<button data-filtro="${id}" aria-pressed="${st.buscaFiltro === id}">${esc(lei(id)?.sigla || "Súmulas")} · ${n}</button>`).join("")}</div>` : ""}
    ${mostra.map(({ lei: l, a }) => `<button class="res" data-res-lei="${l}" data-res-art="${esc(a.id)}"><span class="topo-res">${chip(l)}${esc(a.rot)}${a.canc ? ' <span class="nota">(cancelada)</span>' : ""}</span><span class="trecho">${trecho(a, termos)}</span></button>`).join("")}
    ${!total ? `<div class="vazio"><b>Nada encontrado.</b> Tente menos palavras, ou sem acento não faz diferença. Para uma expressão exata, use aspas: "boa-fé objetiva".</div>` : ""}
  </div>`;
  scrollTo(0, 0);
}
function trecho(a, termos) {
  const p = a.n.indexOf(termos[0]);
  const ini = Math.max(0, p - 90), fim = Math.min(a.txt.length, p + 200);
  const pedaco = a.txt.slice(ini, fim), pn = a.n.slice(ini, fim);
  const marcas = [];
  for (const t of termos) { let i = pn.indexOf(t); while (i >= 0) { marcas.push([i, i + t.length]); i = pn.indexOf(t, i + t.length); } }
  marcas.sort((x, y) => x[0] - y[0]);
  let out = "", pos = 0;
  for (const [s, e] of marcas) { if (s < pos) continue; out += esc(pedaco.slice(pos, s)) + "<mark>" + esc(pedaco.slice(s, e)) + "</mark>"; pos = e; }
  out += esc(pedaco.slice(pos));
  return (ini > 0 ? "… " : "") + out + (fim < a.txt.length ? " …" : "");
}

/* ---------- eventos ---------- */
document.addEventListener("click", e => {
  const a = e.target.closest(".artn");
  if (a) { abrirFerr(a.closest("article")); return; }
  const n = e.target.closest("[data-ir]");
  if (n) { ir(n.dataset.ir, n.dataset.art || null); return; }
  const r = e.target.closest("[data-res-lei]");
  if (r) { const l = r.dataset.resLei, art = r.dataset.resArt; if (l === "sumulas") ir("sumulas", art); else ir(l, art); return; }
  const s = e.target.closest("[data-salto]");
  if (s) { saltar(JSON.parse(s.dataset.salto)).then(ok => { if (!ok) s.textContent = "Não encontrado"; }); return; }
  const f = e.target.closest("[data-filtro]");
  if (f) { st.buscaFiltro = f.dataset.filtro || null; buscar($("#busca").value); }
});
let tBusca;
$("#busca").addEventListener("input", e => { clearTimeout(tBusca); st.buscaFiltro = null; tBusca = setTimeout(() => buscar(e.target.value), 280); });
$("#busca").addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  clearTimeout(tBusca);
  const sal = saltos(e.target.value), q = e.target.value;
  if (!sal.length) { buscar(q); return; }
  e.target.blur();
  saltar(sal[0]).then(ok => { if (!ok) { $("#busca").value = q; buscar(q); } });
});
async function saltar(x) {
  if (x.sum) {
    await carregarSumulas();
    if (!st.sumulas.some(y => y.tr + "-" + y.n === x.sum)) return false;
    ir("sumulas", x.sum); return true;
  }
  await carregarLei(x.lei);
  const art = acharArt(x.lei, x.art);
  if (!art) return false;
  ir(x.lei, art); return true;
}
document.addEventListener("keydown", e => {
  if (e.key === "/" && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); $("#busca").focus(); }
  if (e.key === "Escape") { fecharFerr(); document.body.classList.remove("gaveta"); }
});
$("#inicio").addEventListener("click", () => ir("inicio"));
$("#menu").addEventListener("click", () => document.body.classList.add("gaveta"));
$("#veu").addEventListener("click", () => document.body.classList.remove("gaveta"));
let fs = ler("vm-fs", 17);
const aplicarFs = () => document.documentElement.style.setProperty("--fs-leitura", fs + "px");
$("#fmenos").addEventListener("click", () => { fs = Math.max(14, fs - 1); aplicarFs(); gravar("vm-fs", fs); });
$("#fmais").addEventListener("click", () => { fs = Math.min(23, fs + 1); aplicarFs(); gravar("vm-fs", fs); });

/* ---------- início ---------- */
(async function iniciar() {
  aplicarFs();
  st.notas = ler("vm-notas", true);
  st.marcas = ler("vm-marcas", {});
  try { st.meta = await (await fetch(`dados/indice.json?v=${VERSAO}`)).json(); st.indice = st.meta.leis; }
  catch { principal.innerHTML = `<div class="vazio"><b>Não consegui carregar o índice das leis.</b> Recarregue a página.</div>`; return; }
  montarLateral();
  const h = decodeURIComponent(location.hash.slice(1));
  const m = h.match(/^([a-z]+)(?:-(.+))?$/);
  if (m && (lei(m[1]) || m[1] === "sumulas" || m[1] === "grifos")) {
    if (lei(m[1]) && m[2]) { await carregarLei(m[1]); ir(m[1], acharArt(m[1], m[2]) || null); }
    else ir(m[1], m[2] || null);
  } else vistaInicio();
  conectarConta();
})();
</script>
