# Baixa a versão mais recente das leis, monta o site e publica no GitHub Pages.
# Roda a cada push, toda segunda-feira de manhã e quando você clicar em "Run workflow".
name: Atualizar e publicar

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1"  # segunda, 6h em Brasília
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  montar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Baixar leis e montar o site
        run: python -I build.py tudo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar:
    needs: montar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
